# AI Code Review Configuration

review:
  enabled: true

  # Files to exclude from review
  exclude_patterns:
    - "*.lock"
    - "*.json"
    - "*.md"
    - "*.yaml"
    - "*.yml"
    - "*.txt"
    - "test/**"
    - "tests/**"
    - "__pycache__/**"
    - "*.generated.*"
    - "dist/**"
    - "build/**"
    - "node_modules/**"

  # File extensions to review
  include_extensions:
    - ".py"
    - ".js"
    - ".ts"
    - ".jsx"
    - ".tsx"
    - ".java"
    - ".go"
    - ".cpp"
    - ".c"
    - ".cs"
    - ".php"
    - ".rb"
    - ".swift"
    - ".kt"

  # Minimum severity to report
  min_severity: "INFO"  # INFO, MINOR, MAJOR, CRITICAL

  # Maximum number of comments per PR
  max_comments: 20

  # Auto-approve PRs under conditions
  auto_approve:
    enabled: false
    conditions:
      no_sonar_issues: true
      max_lines_changed: 50
      only_minor_changes: true

llm:
  # Primary model (claude-sonnet-4.5 or gpt-4)
  primary_model: "claude-sonnet-4.5"

  # Fallback model
  fallback_model: "gpt-4"

  # Maximum tokens for response
  max_tokens: 4096

  # Temperature (0.0 = deterministic, 1.0 = creative)
  temperature: 0.3

  # Enable prompt caching (Anthropic)
  enable_caching: true

sonarqube:
  # Enforce quality gate status
  enforce_quality_gate: true

  # Block merge on critical issues
  block_on_critical: true

  # Include SonarQube findings in AI context
  include_in_context: true

github:
  # Post summary comment
  post_summary: true

  # Post inline comments on specific lines
  post_inline_comments: true

  # Use suggested changes feature
  suggest_changes: true

  # Review event type (COMMENT, REQUEST_CHANGES, APPROVE)
  default_event: "COMMENT"

security:
  # Focus areas for security review
  check_sql_injection: true
  check_xss: true
  check_auth_issues: true
  check_secrets_exposure: true
  check_insecure_dependencies: true

code_quality:
  # Code quality checks
  check_complexity: true
  check_duplication: true
  check_naming_conventions: true
  check_error_handling: true
  check_performance: true
  check_best_practices: true

# Custom review prompts (optional)
prompts:
  system_prompt: |
    You are an expert code reviewer with deep knowledge of software engineering best practices,
    security vulnerabilities, and design patterns. Analyze code changes critically but constructively.

  security_focus: |
    Pay special attention to:
    - SQL injection vulnerabilities
    - Cross-site scripting (XSS)
    - Authentication and authorization issues
    - Sensitive data exposure
    - Insecure dependencies

  quality_focus: |
    Evaluate:
    - Code complexity and maintainability
    - Error handling and edge cases
    - Performance implications
    - Code duplication
    - Naming conventions and readability
