# SonarCloud Project Configuration
# This file configures SonarCloud analysis parameters

# Project identification
# sonar.projectKey=${SONAR_PROJECT_KEY}
# sonar.organization=${SONAR_ORGANIZATION}

# Project metadata
sonar.projectName=AI Code Review Agent
sonar.projectVersion=1.0

# Source code location
sonar.sources=scripts
sonar.tests=tests

sonar.coverage.exclusions=scripts/**

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/env/**

# Python specific settings
sonar.python.version=3.11

# Coverage (if you add coverage reporting)
# sonar.python.coverage.reportPaths=coverage.xml

# Quality gate thresholds
sonar.qualitygate.wait=true
